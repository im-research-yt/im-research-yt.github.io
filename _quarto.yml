project:
  type: website
  output-dir: docs

website:
  title: "Yuki Toyoda's Blog"
  description: "Threshold-sweep QCA, marketing science, and data analysis tools"
  site-url: https://im-research-yt.github.io
  favicon: favicon.svg
  image: thumbnail-site.png
  open-graph: true
  twitter-card: true
  navbar:
    background: "#233A9A"
    foreground: white
    logo: logo.svg
    left:
      - text: "Start here"
        href: start-here.qmd
      - text: "Articles"
        href: index.qmd
      - text: "Analysis tools"
        href: tools.qmd
      - text: "ThSQCA"
        href: software.qmd
      - text: "About"
        href: about.qmd
    right:
      - text: "日本語"
        href: ja/index.qmd
      - icon: github
        href: https://github.com/im-research-yt
  page-footer:
    center: "© 2026 Yuki Toyoda, Graduate School of Innovation Management, Hosei University\n\nDeveloped with the assistance of Claude (Anthropic)\n\nPosts about R are also shared via <a href='https://www.r-bloggers.com/'>R-bloggers</a>."

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    include-in-header:
      text: |
        <script data-goatcounter="https://yuki-toyoda.goatcounter.com/count"
                async src="https://gc.zgo.at/count.js"></script>
